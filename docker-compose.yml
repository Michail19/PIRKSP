version: "3.9"

services:
  app:
    build: .
#    container_name: pirksp_app
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    environment:
      APP_HOST: ${APP_HOST:-0.0.0.0}
      PORT: ${PORT:-5000}
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/pirksp}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: pirksp_db
    restart: always
    environment:
      POSTGRES_DB: pirksp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pirksp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
