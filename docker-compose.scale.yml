version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "5000:80"
    depends_on:
      - app1
      - app2
      - app3
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  app1:
    image: ghcr.io/michail19/pirksp:${IMAGE_TAG:-latest}
    environment:
      APP_HOST: 0.0.0.0
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      APP_ENV: staging
      APP_VERSION: ${IMAGE_TAG:-latest}
      SECRET_KEY: ${SECRET_KEY}

  app2:
    image: ghcr.io/michail19/pirksp:${IMAGE_TAG:-latest}
    environment:
      APP_HOST: 0.0.0.0
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      APP_ENV: staging
      APP_VERSION: ${IMAGE_TAG:-latest}
      SECRET_KEY: ${SECRET_KEY}

  app3:
    image: ghcr.io/michail19/pirksp:${IMAGE_TAG:-latest}
    environment:
      APP_HOST: 0.0.0.0
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      APP_ENV: staging
      APP_VERSION: ${IMAGE_TAG:-latest}
      SECRET_KEY: ${SECRET_KEY}

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pirksp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  postgres_data:
